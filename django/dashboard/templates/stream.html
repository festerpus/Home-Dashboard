{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <title>Data Stream</title>

        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <link
            rel="stylesheet"
            href="{% static 'css/tailwind.css' %}"
        >

        <script src="https://cdn.plot.ly/plotly-4.0.0.min.js"></script>


        <script>

            // --------------------------------------------------
            // STATE
            // --------------------------------------------------

            let stream = null;

            let activeMetric = null;
            let activeRange = "hours=24";

            let eventSource = null;


            function streamId() {
                return document.body.dataset.streamId;
            }


            // --------------------------------------------------
            // API URLS
            // --------------------------------------------------

            function streamUrl() {
                return `/sensors/streams/${streamId()}/`;
            }


            function readingsUrl(range = activeRange) {
                return (
                    `/sensors/streams/${streamId()}/readings/`
                    + `?${range}`
                );
            }


            function eventsUrl() {
                return (
                    `/sensors/streams/${streamId()}/events/`
                );
            }


            // --------------------------------------------------
            // HELPERS
            // --------------------------------------------------

            function escapeHtml(value) {

                return String(value ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }


            function timeAgo(timestamp) {

                if (!timestamp) {
                    return "Never";
                }

                const then = new Date(timestamp);
                const now = new Date();

                const seconds =
                    Math.floor((now - then) / 1000);

                if (seconds < 5) {
                    return "Just now";
                }

                if (seconds < 60) {
                    return `${seconds}s ago`;
                }

                const minutes =
                    Math.floor(seconds / 60);

                if (minutes < 60) {

                    return (
                        `${minutes} `
                        + `${
                            minutes === 1
                                ? "minute"
                                : "minutes"
                        } ago`
                    );
                }

                const hours =
                    Math.floor(minutes / 60);

                if (hours < 24) {

                    return (
                        `${hours} `
                        + `${
                            hours === 1
                                ? "hour"
                                : "hours"
                        } ago`
                    );
                }

                const days =
                    Math.floor(hours / 24);

                return (
                    `${days} `
                    + `${
                        days === 1
                            ? "day"
                            : "days"
                    } ago`
                );
            }


            function formatValue(value, config) {

                if (
                    value === undefined
                    || value === null
                ) {
                    return "--";
                }

                if (typeof value !== "number") {
                    return value;
                }

                const decimals =
                    Number.isInteger(config?.decimals)
                        ? config.decimals
                        : 2;

                return value.toFixed(decimals);
            }


            function streamName() {

                if (!stream) {
                    return "Data Stream";
                }

                if (stream.name) {
                    return stream.name;
                }

                if (
                    stream.source?.type === "local"
                ) {
                    return stream.source.device_id;
                }

                if (
                    stream.source?.type === "external"
                ) {
                    return stream.source.provider;
                }

                return "Data Stream";
            }


            function sourceLabel() {

                if (!stream?.source) {
                    return "Unknown source";
                }

                if (
                    stream.source.type === "local"
                ) {
                    return (
                        `Local · `
                        + stream.source.device_id
                    );
                }

                if (
                    stream.source.type === "external"
                ) {
                    return (
                        `External · `
                        + stream.source.provider
                    );
                }

                return "Unknown source";
            }


            // --------------------------------------------------
            // API
            // --------------------------------------------------

            async function getStream() {

                const response =
                    await fetch(
                        streamUrl()
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                return await response.json();
            }


            async function getReadings(
                range = activeRange
            ) {

                const response =
                    await fetch(
                        readingsUrl(range)
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                return await response.json();
            }


            // --------------------------------------------------
            // HEADER
            // --------------------------------------------------

            function renderHeader() {

                document.querySelector(
                    "#stream-name"
                ).textContent =
                    streamName();


                document.querySelector(
                    "#stream-source"
                ).textContent =
                    sourceLabel();


                document.querySelector(
                    "#stream-id"
                ).textContent =
                    stream.id;


                const lastReading =
                    stream.latest_reading;


                const lastElement =
                    document.querySelector(
                        "#last-reading"
                    );

                const timestamp =
                    lastReading?.received_at
                    ?? "";


                lastElement.dataset.timestamp =
                    timestamp;

                lastElement.textContent =
                    timeAgo(timestamp);
            }


            // --------------------------------------------------
            // METRIC CARDS
            // --------------------------------------------------

            function metricCard(
                metricKey,
                config
            ) {

                const latest =
                    stream.latest_reading
                    ?.measurements?.[metricKey];


                return `
                    <button
                        type="button"

                        id="metric-card-${metricKey}"

                        data-metric="${metricKey}"

                        onclick="selectMetric('${metricKey}')"

                        class="
                            metric-card
                            rounded-2xl
                            border
                            border-zinc-800
                            bg-zinc-900
                            p-5
                            text-left
                            transition
                            hover:border-zinc-700
                            hover:bg-zinc-800/70
                        "
                    >

                        <p
                            class="
                                text-sm
                                text-zinc-500
                            "
                        >
                            ${escapeHtml(
                                config.name
                                ?? metricKey
                            )}
                        </p>


                        <div
                            class="
                                mt-3
                                flex
                                items-end
                                gap-2
                            "
                        >

                            <span
                                id="metric-value-${metricKey}"
                                class="
                                    text-4xl
                                    font-light
                                    tracking-tight
                                "
                            >
                                ${escapeHtml(
                                    formatValue(
                                        latest,
                                        config
                                    )
                                )}
                            </span>


                            ${
                                config.unit
                                    ? `
                                        <span
                                            class="
                                                pb-1
                                                text-zinc-400
                                            "
                                        >
                                            ${escapeHtml(
                                                config.unit
                                            )}
                                        </span>
                                    `
                                    : ""
                            }

                        </div>


                        <p
                            class="
                                mt-3
                                truncate
                                text-xs
                                text-zinc-600
                            "
                        >
                            ${escapeHtml(
                                metricKey
                            )}
                        </p>

                    </button>
                `;
            }


            function renderMetricCards() {

                const metrics =
                    stream.metrics ?? {};

                const entries =
                    Object.entries(metrics);


                const container =
                    document.querySelector(
                        "#metric-grid"
                    );


                container.innerHTML =
                    entries
                    .map(
                        ([key, config]) =>
                            metricCard(
                                key,
                                config
                            )
                    )
                    .join("");


                if (
                    !activeMetric
                    && entries.length
                ) {
                    activeMetric =
                        entries[0][0];
                }


                updateSelectedMetric();
            }


            function updateSelectedMetric() {

                document
                    .querySelectorAll(
                        ".metric-card"
                    )
                    .forEach(card => {

                        const selected =
                            card.dataset.metric
                            === activeMetric;


                        card.className =
                            selected

                                ? `
                                    metric-card
                                    rounded-2xl
                                    border
                                    border-zinc-600
                                    bg-zinc-800/80
                                    p-5
                                    text-left
                                `

                                : `
                                    metric-card
                                    rounded-2xl
                                    border
                                    border-zinc-800
                                    bg-zinc-900
                                    p-5
                                    text-left
                                    transition
                                    hover:border-zinc-700
                                    hover:bg-zinc-800/70
                                `;
                    });
            }


            // --------------------------------------------------
            // RANGE CONTROLS
            // --------------------------------------------------

            function setActiveRange(range) {

                activeRange = range;


                document
                    .querySelectorAll(
                        "[data-range]"
                    )
                    .forEach(button => {

                        const selected =
                            button.dataset.range
                            === range;


                        button.className =
                            selected

                                ? `
                                    rounded-lg
                                    bg-zinc-100
                                    px-3
                                    py-1.5
                                    text-sm
                                    font-medium
                                    text-zinc-950
                                `

                                : `
                                    rounded-lg
                                    px-3
                                    py-1.5
                                    text-sm
                                    font-medium
                                    text-zinc-400
                                    transition
                                    hover:bg-zinc-800
                                    hover:text-zinc-100
                                `;
                    });
            }


            async function changeRange(range) {

                setActiveRange(range);

                await loadChart();
            }


            // --------------------------------------------------
            // CHART
            // --------------------------------------------------

            function metricConfig() {

                return (
                    stream.metrics?.[activeMetric]
                    ?? {
                        name: activeMetric,
                        unit: "",
                        decimals: 2,
                    }
                );
            }


            async function loadChart() {

                if (
                    !stream
                    || !activeMetric
                ) {
                    return;
                }


                const history =
                    await getReadings(
                        activeRange
                    );


                const config =
                    metricConfig();


                /*
                    Only include readings that actually
                    contain this metric.

                    Useful if metrics are added to a
                    stream later.
                */

                const readings =
                    history.readings.filter(
                        reading =>
                            reading.measurements[
                                activeMetric
                            ] !== undefined
                    );


                const timestamps =
                    readings.map(
                        reading =>
                            reading.observed_at
                    );


                const values =
                    readings.map(
                        reading =>
                            reading.measurements[
                                activeMetric
                            ]
                    );


                Plotly.react(

                    "measurement-chart",

                    [
                        {
                            x: timestamps,
                            y: values,

                            type: "scatter",
                            mode: "lines",

                            name:
                                config.name
                                ?? activeMetric,

                            line: {
                                width: 2,
                            },

                            hovertemplate:
                                `%{y:.${config.decimals ?? 2}f}`
                                + `${config.unit ? " " + config.unit : ""}`
                                + `<br>%{x}`
                                + `<extra></extra>`,
                        }
                    ],

                    {
                        autosize: true,

                        margin: {
                            t: 10,
                            r: 20,
                            b: 50,
                            l: 65,
                        },

                        paper_bgcolor:
                            "transparent",

                        plot_bgcolor:
                            "transparent",

                        font: {
                            color: "#a1a1aa",
                        },

                        xaxis: {

                            gridcolor:
                                "#27272a",

                            zerolinecolor:
                                "#27272a",
                        },

                        yaxis: {

                            title:
                                config.unit
                                    ? (
                                        `${config.name} `
                                        + `(${config.unit})`
                                    )
                                    : config.name,

                            gridcolor:
                                "#27272a",

                            zerolinecolor:
                                "#27272a",
                        },

                        showlegend: false,
                    },

                    {
                        responsive: true,
                        displaylogo: false,

                        modeBarButtonsToRemove: [
                            "lasso2d",
                            "select2d",
                        ],
                    }
                );


                document.querySelector(
                    "#chart-title"
                ).textContent =
                    `${
                        config.name
                        ?? activeMetric
                    } history`;


                document.querySelector(
                    "#chart-subtitle"
                ).textContent =
                    `${readings.length} readings`;
            }


            async function selectMetric(metric) {

                activeMetric = metric;

                updateSelectedMetric();

                await loadChart();
            }


            // --------------------------------------------------
            // SSE
            // --------------------------------------------------

            function setLiveState(state) {

                const dot =
                    document.querySelector(
                        "#live-dot"
                    );

                const text =
                    document.querySelector(
                        "#live-text"
                    );


                if (state === "connected") {

                    dot.className =
                        "h-2 w-2 rounded-full bg-emerald-400";

                    text.className =
                        "text-xs font-medium text-emerald-400";

                    text.textContent =
                        "Live";

                    return;
                }


                if (state === "connecting") {

                    dot.className =
                        "h-2 w-2 rounded-full bg-amber-400";

                    text.className =
                        "text-xs font-medium text-amber-400";

                    text.textContent =
                        "Connecting";

                    return;
                }


                dot.className =
                    "h-2 w-2 rounded-full bg-red-400";

                text.className =
                    "text-xs font-medium text-red-400";

                text.textContent =
                    "Disconnected";
            }


            function updateLatestReading(
                reading
            ) {

                stream.latest_reading =
                    reading;


                Object.entries(
                    reading.measurements ?? {}
                ).forEach(
                    ([metric, value]) => {

                        const element =
                            document.getElementById(
                                `metric-value-${metric}`
                            );

                        if (!element) {
                            return;
                        }


                        const config =
                            stream.metrics?.[
                                metric
                            ];


                        element.textContent =
                            formatValue(
                                value,
                                config
                            );
                    }
                );


                const lastElement =
                    document.querySelector(
                        "#last-reading"
                    );


                const timestamp =
                    reading.received_at
                    ?? reading.observed_at;


                lastElement.dataset.timestamp =
                    timestamp;

                lastElement.textContent =
                    timeAgo(timestamp);
            }


            function appendReadingToChart(
                reading
            ) {

                if (
                    !activeMetric
                    || reading.measurements[
                        activeMetric
                    ] === undefined
                ) {
                    return;
                }


                Plotly.extendTraces(

                    "measurement-chart",

                    {
                        x: [[
                            reading.observed_at
                        ]],

                        y: [[
                            reading.measurements[
                                activeMetric
                            ]
                        ]],
                    },

                    [0]
                );


                /*
                    Increment count shown below chart.
                */

                const subtitle =
                    document.querySelector(
                        "#chart-subtitle"
                    );

                const match =
                    subtitle.textContent.match(
                        /^(\d+)/
                    );


                if (match) {

                    const count =
                        Number(match[1]) + 1;

                    subtitle.textContent =
                        `${count} readings`;
                }
            }


            function connectSSE() {

                setLiveState(
                    "connecting"
                );


                eventSource =
                    new EventSource(
                        eventsUrl()
                    );


                eventSource.addEventListener(
                    "connected",
                    () => {

                        setLiveState(
                            "connected"
                        );
                    }
                );


                eventSource.addEventListener(
                    "reading",
                    event => {

                        try {

                            const reading =
                                JSON.parse(
                                    event.data
                                );


                            updateLatestReading(
                                reading
                            );


                            appendReadingToChart(
                                reading
                            );

                        } catch (error) {

                            console.error(
                                "Invalid SSE payload:",
                                error
                            );
                        }
                    }
                );


                eventSource.onopen =
                    () => {

                        setLiveState(
                            "connected"
                        );
                    };


                eventSource.onerror =
                    () => {

                        /*
                            EventSource reconnects
                            automatically.
                        */

                        setLiveState(
                            "connecting"
                        );
                    };
            }


            // --------------------------------------------------
            // RELATIVE TIME
            // --------------------------------------------------

            function updateRelativeTimes() {

                document
                    .querySelectorAll(
                        "[data-timestamp]"
                    )
                    .forEach(element => {

                        element.textContent =
                            timeAgo(
                                element.dataset.timestamp
                            );
                    });
            }


            // --------------------------------------------------
            // METADATA
            // --------------------------------------------------

            function renderMetadata() {

                const metadata =
                    stream.metadata ?? {};


                const entries =
                    Object.entries(metadata);


                const section =
                    document.querySelector(
                        "#metadata-section"
                    );


                const container =
                    document.querySelector(
                        "#metadata-grid"
                    );


                if (!entries.length) {

                    section.classList.add(
                        "hidden"
                    );

                    return;
                }


                section.classList.remove(
                    "hidden"
                );


                container.innerHTML =
                    entries
                    .map(
                        ([key, value]) => `
                            <div
                                class="
                                    flex
                                    items-start
                                    justify-between
                                    gap-4
                                    border-b
                                    border-zinc-800
                                    py-3
                                    last:border-0
                                "
                            >
                                <span
                                    class="
                                        text-sm
                                        text-zinc-500
                                    "
                                >
                                    ${escapeHtml(key)}
                                </span>

                                <span
                                    class="
                                        text-right
                                        text-sm
                                        text-zinc-300
                                    "
                                >
                                    ${escapeHtml(
                                        typeof value === "object"
                                            ? JSON.stringify(value)
                                            : value
                                    )}
                                </span>
                            </div>
                        `
                    )
                    .join("");
            }


            // --------------------------------------------------
            // INITIAL LOAD
            // --------------------------------------------------

            async function initialise() {

                try {

                    stream =
                        await getStream();


                    const metrics =
                        Object.keys(
                            stream.metrics ?? {}
                        );


                    if (metrics.length) {
                        activeMetric =
                            metrics[0];
                    }


                    renderHeader();

                    renderMetricCards();

                    renderMetadata();


                    setActiveRange(
                        activeRange
                    );


                    if (activeMetric) {

                        await loadChart();

                    } else {

                        document.querySelector(
                            "#chart-title"
                        ).textContent =
                            "No metrics registered";
                    }


                    connectSSE();

                } catch (error) {

                    console.error(
                        "Failed to initialise stream:",
                        error
                    );


                    document.querySelector(
                        "#page-content"
                    ).innerHTML = `
                        <div
                            class="
                                rounded-2xl
                                border
                                border-red-900
                                bg-red-950/30
                                p-6
                                text-red-300
                            "
                        >
                            Failed to load this data stream.
                        </div>
                    `;
                }
            }


            window.addEventListener(
                "DOMContentLoaded",
                () => {

                    initialise();

                    setInterval(
                        updateRelativeTimes,
                        1000
                    );
                }
            );

        </script>
    </head>


    <body
        data-stream-id="{{ stream_id }}"
        class="
            min-h-screen
            bg-zinc-950
            text-zinc-100
        "
    >

        <main
            id="page-content"
            class="
                mx-auto
                max-w-7xl
                px-6
                py-8
            "
        >

            <!-- BACK -->

            <a
                href="/"
                class="
                    mb-6
                    inline-flex
                    items-center
                    gap-2
                    text-sm
                    text-zinc-400
                    transition
                    hover:text-zinc-100
                "
            >
                ← Environment
            </a>


            <!-- HEADER -->

            <header
                class="
                    mb-8
                    flex
                    flex-col
                    gap-4
                    sm:flex-row
                    sm:items-start
                    sm:justify-between
                "
            >

                <div>

                    <div
                        class="
                            flex
                            flex-wrap
                            items-center
                            gap-3
                        "
                    >

                        <h1
                            id="stream-name"
                            class="
                                text-3xl
                                font-bold
                                tracking-tight
                            "
                        >
                            Data Stream
                        </h1>


                        <div
                            class="
                                flex
                                items-center
                                gap-2
                                rounded-full
                                border
                                border-zinc-800
                                bg-zinc-900
                                px-3
                                py-1.5
                            "
                        >

                            <span
                                id="live-dot"
                                class="
                                    h-2
                                    w-2
                                    rounded-full
                                    bg-zinc-500
                                "
                            ></span>

                            <span
                                id="live-text"
                                class="
                                    text-xs
                                    font-medium
                                    text-zinc-400
                                "
                            >
                                Connecting
                            </span>

                        </div>

                    </div>


                    <p
                        id="stream-source"
                        class="
                            mt-2
                            text-sm
                            text-zinc-400
                        "
                    >
                        --
                    </p>


                    <p
                        id="stream-id"
                        class="
                            mt-1
                            font-mono
                            text-xs
                            text-zinc-600
                        "
                    >
                        --
                    </p>

                </div>


                <div
                    class="
                        rounded-xl
                        border
                        border-zinc-800
                        bg-zinc-900
                        px-4
                        py-3
                    "
                >

                    <p
                        class="
                            text-xs
                            text-zinc-500
                        "
                    >
                        Last reading
                    </p>

                    <p
                        id="last-reading"
                        data-timestamp=""
                        class="
                            mt-1
                            text-sm
                            font-medium
                            text-zinc-200
                        "
                    >
                        --
                    </p>

                </div>

            </header>


            <!-- METRICS -->

            <section
                id="metric-grid"
                class="
                    mb-6
                    grid
                    grid-cols-1
                    gap-4
                    sm:grid-cols-2
                    lg:grid-cols-3
                    xl:grid-cols-4
                "
            >
            </section>


            <!-- CHART -->

            <section
                class="
                    rounded-2xl
                    border
                    border-zinc-800
                    bg-zinc-900
                    p-5
                "
            >

                <div
                    class="
                        mb-5
                        flex
                        flex-col
                        gap-4
                        lg:flex-row
                        lg:items-center
                        lg:justify-between
                    "
                >

                    <div>

                        <h2
                            id="chart-title"
                            class="
                                text-lg
                                font-semibold
                            "
                        >
                            Metric history
                        </h2>


                        <p
                            id="chart-subtitle"
                            class="
                                mt-1
                                text-sm
                                text-zinc-500
                            "
                        >
                            Loading readings...
                        </p>

                    </div>


                    <!-- RANGE SELECTOR -->

                    <div
                        class="
                            flex
                            flex-wrap
                            gap-1
                            rounded-xl
                            bg-zinc-950
                            p-1
                        "
                    >

                        <button
                            data-range="minutes=1"
                            onclick="
                                changeRange(
                                    'minutes=1'
                                )
                            "
                        >
                            1m
                        </button>


                        <button
                            data-range="minutes=15"
                            onclick="
                                changeRange(
                                    'minutes=15'
                                )
                            "
                        >
                            15m
                        </button>


                        <button
                            data-range="hours=1"
                            onclick="
                                changeRange(
                                    'hours=1'
                                )
                            "
                        >
                            1h
                        </button>


                        <button
                            data-range="hours=6"
                            onclick="
                                changeRange(
                                    'hours=6'
                                )
                            "
                        >
                            6h
                        </button>


                        <button
                            data-range="hours=24"
                            onclick="
                                changeRange(
                                    'hours=24'
                                )
                            "
                        >
                            24h
                        </button>


                        <button
                            data-range="days=7"
                            onclick="
                                changeRange(
                                    'days=7'
                                )
                            "
                        >
                            7d
                        </button>


                        <button
                            data-range="months=1"
                            onclick="
                                changeRange(
                                    'months=1'
                                )
                            "
                        >
                            1mo
                        </button>

                    </div>

                </div>


                <div
                    id="measurement-chart"
                    class="
                        h-[430px]
                        w-full
                    "
                ></div>

            </section>


            <!-- METADATA -->

            <section
                id="metadata-section"
                class="
                    mt-6
                    rounded-2xl
                    border
                    border-zinc-800
                    bg-zinc-900
                    p-5
                "
            >

                <div class="mb-3">

                    <h2
