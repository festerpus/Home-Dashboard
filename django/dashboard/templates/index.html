{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <title>Sensor Dashboard</title>

        <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

        <script>

            function timeAgo(timestamp) {
                if (!timestamp) {
                    return "Never";
                }

                const then = new Date(timestamp);
                const now = new Date();

                const seconds = Math.floor((now - then) / 1000);

                if (seconds < 5) {
                    return "Just now";
                }

                if (seconds < 60) {
                    return `${seconds} seconds ago`;
                }

                const minutes = Math.floor(seconds / 60);

                if (minutes < 60) {
                    return `${minutes} ${minutes === 1 ? "minute" : "minutes"} ago`;
                }

                const hours = Math.floor(minutes / 60);

                if (hours < 24) {
                    return `${hours} ${hours === 1 ? "hour" : "hours"} ago`;
                }

                const days = Math.floor(hours / 24);

                if (days < 30) {
                    return `${days} ${days === 1 ? "day" : "days"} ago`;
                }

                return then.toLocaleDateString();
            }

            function updateRelativeTimes() {
                document.querySelectorAll(".sensor-last-reading").forEach(element => {
                    element.textContent = timeAgo(element.dataset.timestamp);
                });
            }

            function sensorCard(sensor) {
                const active = sensor.active;

                return `
                    <a href="/device/${sensor.id}/" class="block">
                        <article
                            id="sensor-${sensor.id}" 
                            data-last-reading="${sensor.latest_reading_recieved_at ?? ""}"
                            class="rounded-2xl border border-zinc-800 bg-zinc-900 p-5 shadow-sm transition hover:border-zinc-700 hover:bg-zinc-800/70"
                        >
                            <div class="flex items-start justify-between gap-4">
                                <div>
                                    <h2 class="text-lg font-semibold">
                                        ${sensor.name}
                                    </h2>

                                    <p class="mt-1 text-xs text-zinc-500">
                                        ${sensor.device_id}
                                    </p>
                                </div>

                                <span class="sensor-state rounded-full px-2.5 py-1 text-xs font-medium ${
                                    active
                                        ? "bg-emerald-950 text-emerald-400"
                                        : "bg-red-950 text-red-400"
                                }">
                                    ${active ? "Active" : "Inactive"}
                                </span>
                            </div>

                            <div class="mt-8">
                                <div class="flex items-end gap-2">
                                    <span class="sensor-temperature text-5xl font-light tracking-tight">
                                        ${sensor.latest_reading?.temperature_c ?? "--"}
                                    </span>

                                    <span class="pb-1 text-lg text-zinc-400">
                                        °C
                                    </span>
                                </div>
                            </div>

                            <div class="mt-8 border-t border-zinc-800 pt-4 text-sm text-zinc-400">
                                Last reading

                                <span class="sensor-last-reading float-right text-zinc-300" data-timestamp="${sensor.latest_reading_received_at ?? ""}">
                                    ${timeAgo(sensor.latest_reading_received_at)}
                                </span>
                            </div>
                        </article>
                    </a>
                `;
            }

            function updateSensorCard(sensor) {
                const card = document.querySelector(`#sensor-${sensor.id}`);

                if (!card) {
                    return;
                }

                const previousTimestamp = card.dataset.lastReading;
                const newTimestamp = sensor.latest_reading_received_at ?? "";

                if (previousTimestamp === newTimestamp) {
                    return;
                }

                card.dataset.lastReading = newTimestamp;

                const temperature = card.querySelector(".sensor-temperature");
                const lastReading = card.querySelector(".sensor-last-reading");
                const state = card.querySelector(".sensor-state");

                temperature.textContent =
                    sensor.latest_reading?.temperature_c ?? "--";

                lastReading.dataset.timestamp = newTimestamp;
                lastReading.textContent = timeAgo(newTimestamp);

                state.textContent = sensor.active ? "Active" : "Inactive";

                state.className = `
                    sensor-state
                    rounded-full
                    px-2.5 py-1
                    text-xs
                    font-medium
                    ${
                        sensor.active
                            ? "bg-emerald-950 text-emerald-400"
                            : "bg-red-950 text-red-400"
                    }
                `;
            }

            async function watchSensors() {
                try {
                    const response = await fetch("/sensors/");

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();

                    data.sensors.forEach(updateSensorCard);

                } catch (error) {
                    console.error("Sensor watch failed:", error);
                }
            }

            async function getSensors() {
                const response = await fetch("/sensors/");

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                const grid = document.querySelector("#sensor-grid");

                grid.innerHTML = data.sensors
                    .map(sensorCard)
                    .join("");

                return data.sensors;
            }

            window.addEventListener("DOMContentLoaded", async () => {
                await getSensors();

                watchSensors();

                setInterval(() => {
                    updateRelativeTimes();
                }, 1000);

                setInterval(() => {
                    watchSensors();
                }, 5000);
            });
        </script>
    </head>
    <body class="min-h-screen bg-zinc-950 text-zinc-100">

        <main class="mx-auto max-w-7xl px-6 py-8">

            <header class="mb-8 flex items-end justify-between gap-4">

                <div>
                    <h1 class="text-3xl font-bold tracking-tight">
                        Environment
                    </h1>

                    <p class="mt-1 text-sm text-zinc-400">
                        Live sensor overview
                    </p>
                </div>

                <!-- <div class="text-right text-xs text-zinc-500">

                    <div id="refresh-status">
                        Updated
                    </div>

                    <div class="mt-1">
                        Refresh in
                        <span
                            id="refresh-countdown"
                            class="font-medium text-zinc-300"
                        >
                            60s
                        </span>
                    </div>

                </div> -->

            </header>

            <section id="sensor-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            </section>
        </main>
    </body>
</html>
